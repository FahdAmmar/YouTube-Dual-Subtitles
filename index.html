<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />

    <!-- الأيقونات: SVG قابل للتحجيم للمتصفحات الحديثة + PNG احتياطي للأقدم، وapple-touch-icon مخصّص لـiOS (لا يدعم SVG لأيقونات الشاشة الرئيسية) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      سكربت مضمّن (Inline) يُنفَّذ قبل أي رسم للصفحة، لتطبيق السمة الصحيحة
      (الداكنة أو الفاتحة) فوراً دون وميض مرئي (Flash of Wrong Theme).
      المفتاح 'ydc:theme-preference' يجب أن يبقى مطابقاً تماماً لقيمة
      STORAGE_KEYS.THEME في src/constants/theme.constants.ts
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ydc:theme-preference')
          var preference = stored ? JSON.parse(stored) : 'system'
          var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = preference === 'system' ? (systemPrefersDark ? 'dark' : 'light') : preference
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <meta
      name="description"
      content="شاهد فيديوهات يوتيوب مع ترجمتين متزامنتين بلغتين مختلفتين في آن واحد — أداة مثالية لتعلم اللغات ومقارنة الترجمات."
    />
    <meta property="og:title" content="مترجم يوتيوب المزدوج" />
    <meta
      property="og:description"
      content="شاهد فيديوهات يوتيوب مع ترجمتين متزامنتين بلغتين مختلفتين في آن واحد."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مترجم يوتيوب المزدوج" />
    <meta
      name="twitter:description"
      content="شاهد فيديوهات يوتيوب مع ترجمتين متزامنتين بلغتين مختلفتين في آن واحد."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>مترجم يوتيوب المزدوج | ترجمتان متزامنتان بلغتين مختلفتين</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
