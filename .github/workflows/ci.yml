name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm >= 11 مطلوب: npm 10.x يتعارض مع شجرة peer dependencies الخاصة
      # بـ vitest 4.x (خطأ داخلي في arborist) — انظر "engines" في package.json
      - name: Ensure npm >= 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
